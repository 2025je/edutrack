{% if is_paginated %}<nav class="pager no-print">
{% if page_obj.has_previous %}<a class="btn-flat btn-small blue-text" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"><i class="material-icons">chevron_left</i>Anterior</a>{% endif %}
<span class="muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a class="btn-flat btn-small blue-text" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente<i class="material-icons" style="margin:0 0 0 4px">chevron_right</i></a>{% endif %}
</nav>{% endif %}
