services:
  # Instancia 1: Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=db_edutrack
      - POSTGRES_USER=edutrack_admin
      - POSTGRES_PASSWORD=edutrack_admin_pass
    ports:
      - "5432:5432"

  # Instancia 2: Aplicación Django
  web:
    build: .
    container_name: django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=db_edutrack
      - DB_USER=edutrack_admin
      - DB_PASSWORD=edutrack_admin_pass
    depends_on:
      - db

volumes:
  postgres_data: