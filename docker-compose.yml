name: edutrack

services:
  # Instancia 1: Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache compartida de Django; su contenido es efímero.
  redis:
    image: redis:7-alpine
    container_name: edutrack_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Instancia 2: Aplicación Django
  web:
    image: ${EDUTRACK_IMAGE:-edutrack:local}
    build: .
    container_name: django_app
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_WORKERS:-3} --threads ${WEB_THREADS:-2} --worker-class gthread --worker-tmp-dir /dev/shm --max-requests 1000 --max-requests-jitter 100 --timeout 60 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
    expose:
      - "8000"
    volumes:
      - django_media:/app/media
      - django_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/salud/', headers={'Host': 'localhost'}), timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 90s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Instancia 2b: WebSockets (Django Channels sobre Uvicorn/ASGI). Gunicorn sigue
  # atendiendo HTTP; este servicio solo recibe /ws/ y comparte avisos vía Redis.
  ws:
    image: ${EDUTRACK_IMAGE:-edutrack:local}
    build: .
    container_name: django_ws
    restart: unless-stopped
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers ${WS_WORKERS:-1} --no-access-log
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_channel_layer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  # Respaldos diarios de PostgreSQL y media, con prueba automática de restauración.
  backup:
    image: postgres:15-alpine
    container_name: edutrack_backup
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - ${BACKUP_OFFSITE_PATH:-./backups/offsite}:/offsite
      - django_media:/srv/media:ro
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  # Instancia 3: Proxy inverso y servidor de archivos estáticosáticos
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - django_media:/srv/media:ro
      - django_static:/srv/static:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/salud/"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      web:
        condition: service_healthy
      ws:
        condition: service_healthy

  loki:
    image: grafana/loki:latest
    container_name: edutrack_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml", "-target=all"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: edutrack_alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: edutrack_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      - loki

volumes:
  postgres_data:
  django_media:
  django_static:
  loki_data:
  alloy_data:
  grafana_data: