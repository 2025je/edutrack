[project]
name = "edutrack"
version = "0.1.0"
description = "Sistema web para administrar estudiantes, matrículas y pagos"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=6.0,<6.1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "openpyxl>=3.1,<4",
    "django-extensions>=3.2.3,<5",
    "Werkzeug>=3.0,<4",
    "Pillow>=10.4,<13",
    "django-redis>=7.0.0,<8.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff>=0.17.0,<0.18.0",
    "pre-commit>=4.7.0,<5.0.0",
    "django-debug-toolbar>=8.0.0,<9.0.0",
    "pyright>=1.1.414",
]
