[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edutrack-desktop"
version = "0.1.0"
description = "Aplicación de escritorio offline de EduTrack con Python y QML"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "PySide6-Addons>=6.8,<7",
    "PySide6-Essentials>=6.8,<7",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "colorama>=0.4.6",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "rich>=15.0.0",
    "structlog>=25,<26",
]

[project.scripts]
edutrack-desktop = "edutrack_desktop.presentation.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "pyinstaller>=6,<7",
    "pytest-benchmark>=5,<6",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/edutrack_desktop"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not performance'"
markers = ["performance: opt-in performance benchmarks"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutrack_desktop"]

[tool.uv]
package = true
