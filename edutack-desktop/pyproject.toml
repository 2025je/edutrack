[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edutrack-desktop"
version = "0.1.0"
description = "Aplicación de escritorio offline de EduTrack con Python y QML"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "PySide6-Addons>=6.8,<7",
    "PySide6-Essentials>=6.8,<7",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "colorama>=0.4.6",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "rich>=15.0.0",
    "structlog>=25,<26",
]

[project.scripts]
edutrack-desktop = "edutrack_desktop.presentation.main:main"

[dependency-groups]
dev = [
    { include-group = "nox" },
    { include-group = "test" },
    { include-group = "coverage" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    "pyinstaller>=6,<7",
]
nox = [
    "nox>=2024.10.9,<2027",
    "nox-uv>=0.8,<0.9",
]
test = [
    "hypothesis>=6.100,<7",
    "pytest>=8,<9",
    "pytest-benchmark>=5,<6",
]
coverage = [
    "pytest-cov>=6,<8",
]
lint = [
    "ruff>=0.12,<1",
]
typecheck = [
    "mypy>=1.13,<2",
    "types-colorama>=0.4.15,<1",
    "types-openpyxl>=3.1,<4",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/edutrack_desktop"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not performance'"
markers = ["performance: opt-in performance benchmarks"]

[tool.hatch.build.targets.wheel]
packages = ["src/edutrack_desktop"]

[tool.uv]
package = true
