name: Dependency audit

on:
  push:
    paths:
      - "edutrack-web/pyproject.toml"
      - "edutrack-web/uv.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "edutrack-web/pyproject.toml"
      - "edutrack-web/uv.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit locked runtime dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edutrack-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: edutrack-web/uv.lock

      - name: Export locked production dependencies
        run: uv export --locked --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"

      - name: Audit dependencies
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip --progress-spinner off
