name: Django CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / PostgreSQL 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: edutrack_ci
          POSTGRES_USER: edutrack_ci
          POSTGRES_PASSWORD: edutrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edutrack_ci -d edutrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: edutrack_ci
      DB_USER: edutrack_ci
      DB_PASSWORD: edutrack_ci
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        run: poetry sync --no-root

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Check Django configuration
        run: poetry run python manage.py check

      - name: Verify runserver_plus command
        run: poetry run python manage.py help runserver_plus

      - name: Check migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: poetry run python manage.py migrate --noinput

      - name: Run tests
        run: poetry run python manage.py test
