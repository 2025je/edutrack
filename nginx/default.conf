map $arg_v $static_expires {
    default 1h;
    "~^[0-9]+$" 30d;
}

# Respeta X-Forwarded-Proto si hay un balanceador/TLS delante de este nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/static/;
        expires $static_expires;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Los archivos subidos solo se entregan tras la autorización de Django
    # (cabecera X-Accel-Redirect); esta ruta no es accesible desde fuera.
    location /_protected_media/ {
        internal;
        alias /srv/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
