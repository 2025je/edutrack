<div class="col s12 m6"><label for="{{ flyer_form.title.id_for_label }}">Título</label>{{ flyer_form.title }}{% for error in flyer_form.title.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>
<div class="col s12 m6"><label for="{{ flyer_form.file.id_for_label }}">Archivo PDF o imagen (máx. 10 MB)</label>{{ flyer_form.file }}{% for error in flyer_form.file.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>
<div id="flyer-preview-box" class="col s12" style="display:none;margin-top:1rem">
  <label>Vista previa</label>
  <iframe id="flyer-preview-frame" title="Vista previa del archivo seleccionado" style="width:100%;height:420px;border:1px solid rgba(128,128,128,.4);border-radius:4px;background:#fff;display:none"></iframe>
  <img id="flyer-preview-image" alt="Vista previa del archivo seleccionado" style="max-width:100%;max-height:420px;border:1px solid rgba(128,128,128,.4);border-radius:4px;display:none">
</div>
<script>
(function () {
  var input = document.getElementById("{{ flyer_form.file.id_for_label }}");
  var box = document.getElementById("flyer-preview-box");
  var frame = document.getElementById("flyer-preview-frame");
  var image = document.getElementById("flyer-preview-image");
  var url = null;
  input.addEventListener("change", function () {
    if (url) { URL.revokeObjectURL(url); url = null; }
    frame.removeAttribute("src"); image.removeAttribute("src");
    frame.style.display = "none"; image.style.display = "none";
    var file = input.files[0];
    var isPdf = file && (file.type === "application/pdf" || /\.pdf$/i.test(file.name));
    var isImage = file && (/^image\/(png|jpeg|webp)$/.test(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name));
    if (!isPdf && !isImage) { box.style.display = "none"; return; }
    url = URL.createObjectURL(file);
    if (isPdf) { frame.src = url; frame.style.display = "block"; }
    else { image.src = url; image.style.display = "block"; }
    box.style.display = "block";
  });
})();
</script>
